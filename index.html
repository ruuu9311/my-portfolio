<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的作品集</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #172033;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 48px 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 32px;
    }

    h1 { margin: 0 0 12px; }
    h2 { margin-top: 0; }
    p { line-height: 1.7; }
    .muted { color: #64748b; }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      background: #172033;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .secondary { background: #64748b; }

    .panel, .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
    }

    .panel { margin-bottom: 28px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h3, .card p { margin: 0; }
    .card a { color: #2563eb; }

    .repo {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 14px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .repo input { margin-top: 5px; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <main>
    <header class="header">
      <div>
        <h1>Jun Ru Tsai｜作品集</h1>
        <p class="muted">網頁開發、AIoT 與系統整合</p>
      </div>

      <button id="login">GitHub 登入／同步作品</button>
    </header>

    <p id="status" role="status"></p>

    <section id="admin" class="panel" hidden>
      <h2>管理我的作品</h2>
      <p id="identity" class="muted"></p>
      <p>勾選要展示的公開專案，再按「發布作品」。</p>

      <div id="repos"></div>

      <div class="actions">
        <button id="publish" disabled>發布作品</button>
        <button id="logout" class="secondary">登出</button>
      </div>
    </section>

    <section>
      <h2>精選作品</h2>
      <div id="projects" class="grid"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
